<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>Collector History - Dante Point To Point Pisonet</title>
    <link rel="stylesheet" href="vendor/tabler/css/tabler.min.css">
    <link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
    <link rel="stylesheet" href="styles.css?v=2.9">
    <link rel="stylesheet" href="css/collectors.css?v=2.3">
    <link rel="stylesheet" href="css/tabler-app.css?v=2.3">
    <link rel="stylesheet" href="css/collectors-history-tabler.css?v=1.0">
    <script src="theme-init.js?v=2.6"></script>
</head>
<body class="layout-fluid layout-fluid-vertical">
    <div class="app-shell tabler-fluid-vertical">
        <div id="sidebar"></div>
        <div class="app-main page-wrapper">
            <div id="topbar"></div>
            <main class="page collectors-history-page">
                <section class="card collection-history-shell" aria-labelledby="collectionHistoryTitle">
                    <div class="card-header collection-history-top">
                        <div class="collection-history-title">
                            <span class="avatar avatar-sm bg-primary-lt text-primary collection-history-title__icon" aria-hidden="true">
                                <i class="ti ti-chart-line" aria-hidden="true"></i>
                            </span>
                            <div>
                                <h1 class="card-title" id="collectionHistoryTitle">Collection history</h1>
                                <p class="text-secondary mb-0">Track collection performance by month and collector.</p>
                            </div>
                        </div>
                    </div>

                    <div class="card-body collection-history-controls">
                        <div class="collection-history-filter">
                            <label class="form-label" for="monthFilter">Month</label>
                            <div class="input-icon collection-history-select">
                                <span class="input-icon-addon">
                                    <i class="ti ti-calendar" aria-hidden="true"></i>
                                </span>
                                <select class="form-select form-select-sm" id="monthFilter">
                                    <option value="">All months</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive collection-history-table-wrap" id="historyTableWrapper">
                        <table class="table table-vcenter table-sm collection-history-table">
                            <thead>
                                <tr>
                                    <th><i class="ti ti-calendar" aria-hidden="true"></i> Collection Period</th>
                                    <th><i class="ti ti-user" aria-hidden="true"></i> Collector</th>
                                    <th><i class="ti ti-credit-card" aria-hidden="true"></i> Total Collected</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <tr>
                                    <td colspan="3" class="collection-history-empty">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="card-footer collection-history-footer">
                            <div class="collection-history-record-count">
                                <span class="collection-history-info-icon" aria-hidden="true"><i class="ti ti-info-circle" aria-hidden="true"></i></span>
                                <span id="historySummary">Loading history...</span>
                            </div>
                            <div class="collection-history-live">
                                <span>Live data</span>
                                <span class="collection-history-live-dot" aria-hidden="true"></span>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Modal for per-area breakdown -->
    <div class="modal modal-blur tabler-form-modal collectors-history-modal" id="historyModal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title" id="historyModalTitle">Area breakdown</h2>
                        <p class="modal-subtitle mb-0" id="historyModalSubtitle"></p>
                    </div>
                    <button class="btn-close" type="button" id="historyModalClose" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive history-modal-table-wrap" id="historyModalBody"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary btn-sm" type="button" id="historyModalDone">Done</button>
                </div>
            </div>
        </div>
    </div>

    <script src="layout.js?v=3.9"></script>
    <script src="js/collectors-history.js?v=1.5"></script>
    <script src="vendor/tabler/js/tabler.min.js"></script>
    <script src="js/tabler-enhance.js?v=1.6"></script>
</body>
</html>
