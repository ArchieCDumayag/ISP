<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="vendor/tabler/css/tabler.min.css">
    <link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flavor Checklist</title>
  <style>
    :root { font-family: Arial, sans-serif; background: #f6f7fb; color: #172033; }
    body { margin: 0; padding: 28px; }
    main { max-width: 1180px; margin: 0 auto; }
    h1 { margin: 0 0 18px; font-size: 1.55rem; }
    .status { margin: 0 0 18px; padding: 12px 14px; border: 1px solid #d6dcea; background: #fff; border-radius: 8px; font-weight: 700; }
    .status.error { border-color: #ef9a9a; color: #9f1d1d; background: #fff5f5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 14px; }
    .card { background: #fff; border: 1px solid #d6dcea; border-radius: 8px; overflow: hidden; }
    .card header { padding: 14px 16px; background: #eef2f8; border-bottom: 1px solid #d6dcea; }
    .card h2 { margin: 0; font-size: 1rem; }
    .card p { margin: 4px 0 0; color: #64748b; font-size: 0.86rem; }
    .features { padding: 12px 14px 14px; display: grid; gap: 12px; }
    .feature-group { border: 1px solid #e3e8f2; border-radius: 8px; overflow: hidden; background: #fbfcff; }
    .feature-group h3 { margin: 0; padding: 9px 11px; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: #475569; background: #f1f5f9; border-bottom: 1px solid #e3e8f2; }
    .feature-group__items { padding: 7px 10px 9px; display: grid; gap: 4px; }
    label { display: flex; align-items: center; gap: 9px; min-height: 30px; font-size: 0.92rem; }
    input[type="checkbox"] { width: 17px; height: 17px; }
    .actions { padding: 12px 14px 14px; border-top: 1px solid #e6eaf2; }
    button { border: 0; border-radius: 7px; background: #0f766e; color: #fff; padding: 9px 13px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: wait; }
    code { font-family: Consolas, monospace; font-size: 0.86rem; }
  </style>
    <link rel="stylesheet" href="css/tabler-app.css?v=2.1">
</head>
<body>
  <main>
    <h1>Flavor Feature Checklist</h1>
    <div class="status" id="status">Loading...</div>
    <section class="grid" id="cards" aria-label="Flavor feature checklist"></section>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const cardsEl = document.getElementById('cards');
    const FALLBACK_GROUPS = [
      { key: 'core', label: 'Core Pages', features: ['dashboard', 'customers', 'customerDrafts', 'customerArchive', 'plans', 'accounts'] },
      { key: 'billing', label: 'Billing', features: ['payments', 'paymentHistory', 'paymentConfirmationQueue', 'paymentConfirmationQueueHistory'] },
      { key: 'network', label: 'Network', features: ['coverageTable', 'coverageMap', 'ponManagement', 'genieacs', 'mikrotikPppoe'] },
      { key: 'operations', label: 'Operations', features: ['collectors', 'collectionHistory', 'tickets', 'jobs', 'jobHistory'] },
      { key: 'business', label: 'Business Tools', features: ['expenses', 'payroll', 'sms', 'customerAppPopupReminder'] }
    ];
    let state = { order: [], labels: {}, groups: FALLBACK_GROUPS, flavors: [] };
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));

    const setStatus = (message, error = false) => {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', Boolean(error));
    };

    const render = () => {
      const groups = Array.isArray(state.groups) && state.groups.length ? state.groups : FALLBACK_GROUPS;
      cardsEl.innerHTML = state.flavors.map((flavor) => `
        <article class="card" data-flavor="${esc(flavor.name)}">
          <header>
            <h2>${esc(flavor.branch || flavor.name)}</h2>
            <p><code>${esc(flavor.name)}</code></p>
          </header>
          <div class="features">
            ${groups.map((group) => `
              <section class="feature-group" data-group="${esc(group.key)}">
                <h3>${esc(group.label)}</h3>
                <div class="feature-group__items">
                  ${(group.features || []).map((key) => `
                    <label>
                      <input type="checkbox" data-feature="${esc(key)}" ${flavor.features?.[key] ? 'checked' : ''}>
                      <span>${esc(state.labels[key] || key)}</span>
                    </label>
                  `).join('')}
                </div>
              </section>
            `).join('')}
          </div>
          <div class="actions">
            <button type="button" data-action="save">Save Checklist</button>
          </div>
        </article>
      `).join('');
    };

    const load = async () => {
      const response = await fetch('/api/flavors/features', { credentials: 'include', cache: 'no-store' });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.ok === false) throw new Error(payload.error || 'Unable to load flavor features.');
      state = payload;
      render();
      setStatus('Loaded feature checklists. Enable or disable modules per flavor, then save.');
    };

    cardsEl.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-action="save"]');
      if (!button) return;
      const card = button.closest('[data-flavor]');
      const flavorName = card?.dataset.flavor;
      if (!flavorName) return;
      const features = {};
      card.querySelectorAll('input[data-feature]').forEach((input) => {
        features[input.dataset.feature] = Boolean(input.checked);
      });
      button.disabled = true;
      try {
        const response = await fetch(`/api/flavors/${encodeURIComponent(flavorName)}/features`, {
          method: 'PUT',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ features })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.ok === false) throw new Error(payload.error || 'Unable to save checklist.');
        const target = state.flavors.find((item) => item.name === flavorName);
        if (target) target.features = payload.features;
        setStatus(`Saved ${flavorName} checklist.`);
      } catch (error) {
        setStatus(error.message || 'Unable to save checklist.', true);
      } finally {
        button.disabled = false;
      }
    });

    load().catch((error) => setStatus(error.message || 'Unable to load flavor features.', true));
  </script>
    <script src="vendor/tabler/js/tabler.min.js"></script>
    <script src="js/tabler-enhance.js?v=1.4"></script>
</body>
</html>
