<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>History - Dante Point To Point Pisonet</title>
  <link rel="stylesheet" href="vendor/tabler/css/tabler.min.css">
    <link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css?v=2.9">
  <link rel="stylesheet" href="css/technicians.css?v=1.0">
    <link rel="stylesheet" href="css/tabler-app.css?v=2.1">
  <script src="theme-init.js?v=2.6"></script>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar"></div>
    <div class="app-main">
      <div id="topbar"></div>
      <main class="page technician-page">
        <section class="page-header">
          <div class="page-title">
            <p class="eyebrow">Field Operations</p>
            <h1>History</h1>
            <p class="subtitle">Review completed jobs and ticket work.</p>
          </div>
        </section>

        <section class="section-frame elevated">
          <header class="section-heading history-heading">
            <div class="history-toolbar">
              <div class="search-field">
                <i class="ti ti-search" aria-hidden="true"></i>
                <input type="search" id="historySearch" placeholder="Search history, ticket, or technician" aria-label="Search completed history">
              </div>
              <div class="history-actions">
                <div class="filter-chips history-filter-chips" role="radiogroup" aria-label="History status filter">
                  <button class="chip active" data-history-status="all" aria-checked="true">All</button>
                  <button class="chip" data-history-status="ticket" aria-checked="false">Ticket</button>
                  <button class="chip" data-history-status="job" aria-checked="false">Job</button>
                </div>
                <div class="page-size-control">
                  <label for="historyPageSize">Show</label>
                  <div class="select-wrapper">
                    <select id="historyPageSize" aria-label="History records per page">
                      <option value="5">5</option>
                      <option value="10" selected>10</option>
                      <option value="25">25</option>
                      <option value="50">50</option>
                    </select>
                  </div>
                </div>
                <div class="date-filters">
                  <div class="form-field compact">
                    <label for="historyFrom">From</label>
                    <input type="date" id="historyFrom" aria-label="Completed from date">
                  </div>
                  <div class="form-field compact">
                    <label for="historyTo">To</label>
                    <input type="date" id="historyTo" aria-label="Completed to date">
                  </div>
                </div>
              </div>
            </div>
          </header>
          <div class="table-wrapper tech-table-wrapper history-table">
            <table class="settings-table tech-table" aria-label="Completed technician history">
              <thead>
              <tr>
                <th>#</th>
                  <th>Job/Ticket Number</th>
                  <th>Job/Subject</th>
                  <th>Technician</th>
                  <th>Completed</th>
                  <th>Description</th>
                  <th>Actions</th>
              </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr><td colspan="7" style="text-align:center; padding:14px;">Loading...</td></tr>
              </tbody>
            </table>
            <div class="table-footer">
              <div class="footer-summary" id="historySummary">No history yet.</div>
              <div class="footer-controls">
                <button type="button" class="footer-btn" id="historyPrev" aria-label="Previous page" disabled><</button>
                <span class="footer-page-info" id="historyPageInfo">Page 1 of 1</span>
                <button type="button" class="footer-btn" id="historyNext" aria-label="Next page" disabled>></button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="techToast" role="status" aria-live="polite"></div>

  <script src="layout.js?v=3.6"></script>
  <script src="js/job-history.js?v=1.1"></script>
    <script src="vendor/tabler/js/tabler.min.js"></script>
    <script src="js/tabler-enhance.js?v=1.4"></script>
</body>
</html>
