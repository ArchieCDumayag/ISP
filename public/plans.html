<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Dante Point To Point Pisonet - Residential Plans</title>
    <link rel="stylesheet" href="vendor/tabler/css/tabler.min.css">
    <link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
    <link rel="stylesheet" href="styles.css?v=2.9">
    <link rel="stylesheet" href="css/plans.css?v=2.4">
    <link rel="stylesheet" href="css/payments.css?v=2.1">
    <link rel="stylesheet" href="css/tabler-app.css?v=2.3">
    <script src="theme-init.js?v=2.6"></script>
    <style>
        /* Dynamic color for Plans heading based on theme */
        [data-theme="dark"] .page-title h1 {
            color: #ffffff !important;
        }
        [data-theme="light"] .page-title h1,
        .page-title h1 {
            color: #000000 !important;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div id="sidebar"></div>
        <div class="app-main">
            <div id="topbar"></div>
            <main class="page plans-page">
                <section class="page-header">
                    <div class="page-title">
                        <p class="eyebrow">Service Plan Management</p>
                        <h1>Plans</h1>
                        <p class="subtitle">Choose between prepaid and postpaid fiber offers.</p>
                    </div>
                </section>

                <section class="section-frame plan-category" id="postpaid">
                    <header class="category-head" style="display:flex;justify-content:flex-end;align-items:center;">
                        <button class="primary-btn" type="button" data-action="add-plan" data-category="postpaid"><i class="ti ti-plus" aria-hidden="true"></i> Add plan</button>
                    </header>
                    <div class="table-wrapper elevated">
                        <table class="plans-table">
                            <thead>
                                <tr>
                                    <th style="text-align:center;">ID</th>
                                    <th>Plan Name</th>
                                    <th style="text-align:center;">Price</th>
                                    <th style="text-align:center;">Router Profiles</th>
                                    <th class="date-col" style="text-align:center;">Created</th>
                                    <th class="date-col" style="text-align:center;">Updated</th>
                                    <th style="text-align:center;">Total Clients</th>
                                    <th>Type</th>
                                    <th class="col-actions" style="text-align:center;">Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                        <div class="empty-state" id="emptyStatePlans" style="display:none;">
                            <i class="ti ti-box" aria-hidden="true"></i>
                            <p>No plans found.</p>
                        </div>
                        <div class="table-footer" id="plansFooter" style="display:none;">
                            <div class="footer-summary" id="plansSummary">No plans to display</div>
                            <div class="footer-controls">
                                <button type="button" class="footer-btn" id="plansPrev" aria-label="Previous page" disabled>&#8249;</button>
                                <span class="footer-page-info" id="plansPageInfo">Page 1 of 1</span>
                                <button type="button" class="footer-btn" id="plansNext" aria-label="Next page" disabled>&#8250;</button>
                            </div>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <div class="modal" id="planModal" aria-hidden="true" role="dialog" aria-labelledby="planModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="planModalTitle">Add plan</h2>
                    <p class="modal-subtitle" id="planModalSubtitle">Postpaid plan</p>
                </div>
                <button class="close-modal" type="button" data-action="close-plan-modal" aria-label="Close">
                    <i class="ti ti-x" aria-hidden="true"></i>
                </button>
            </div>
            <form class="plan-form" id="planForm">
                <input type="hidden" name="planId">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="planCategory">Plan type</label>
                        <select id="planCategory" name="category">
                            <option value="postpaid">Postpaid</option>
                            <option value="prepaid">Prepaid</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="planName">Plan name</label>
                        <input type="text" id="planName" name="name" required>
                    </div>
                    <div class="form-field">
                        <label for="planPrice">Price</label>
                        <div class="input-with-addon">
                            <span>&#8369;</span>
                            <input type="number" id="planPrice" name="price" required min="0" step="1">
                        </div>
                    </div>
                    <div class="form-field" id="planValidityField" style="display: none;">
                        <label for="planValidity">Validity (days)</label>
                        <input type="number" id="planValidity" name="validity" min="1" step="1">
                    </div>
                    <div class="form-field" style="grid-column: 1 / -1;">
                        <label for="planRouterBindings">Router profiles</label>
                        <div id="planRouterBindings"></div>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="ghost-btn" type="button" data-action="close-plan-modal">Cancel</button>
                    <button class="primary-btn" type="submit"><i class="ti ti-device-floppy" aria-hidden="true"></i> Save plan</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="planToast" role="status" aria-live="polite"></div>

    <script src="plans.js?v=2.9"></script>
    <script src="layout.js?v=3.7"></script>
    <script src="vendor/tabler/js/tabler.min.js"></script>
    <script src="js/tabler-enhance.js?v=1.6"></script>
</body>
</html>
